name: "Portfolio Publish"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '.idea/**'
      - '.vscode/**'
  workflow_dispatch:

# Finish an active release; collapse queued pushes to the newest commit.
concurrency:
  group: portfolio-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tenchi-of-darkness/showcase-portfolio

jobs:
  docker-image:
    name: "Build ${{ matrix.arch }} image"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log into registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max,compression=zstd,compression-level=3
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish-image:
    name: "Publish multi-platform image"
    runs-on: ubuntu-26.04
    needs: docker-image
    permissions:
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log into registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          sources=()
          for digest in *; do
            sources+=("${image}@sha256:${digest}")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:${GITHUB_SHA}" \
            "${sources[@]}"

  kubernetes-deploy:
    name: "Deploy to Kubernetes cluster"
    runs-on: ubuntu-26.04
    needs: publish-image
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Connect to the tailnet for private SSH and Kubernetes access
        uses: tailscale/github-action@v4
        with:
          version: '1.104.1'
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Deploy to the Kubernetes cluster
        uses: azure/k8s-deploy@v5
        with:
          namespace: showcase-portfolio
          manifests: |
            kubernetes/frontend-deployment.yaml
            kubernetes/frontend-httproute.yaml
            kubernetes/frontend-service.yaml
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
