apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "frontend"
  labels:
    portfolio.application: "frontend"
    infrastructure.melanievandegraaf.nl/public-dns: 'true'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: public-ingress
      sectionName: melanievandegraaf-nl-https
  hostnames:
    - melanievandegraaf.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: "frontend"
          port: 80
          weight: 1